<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-labelledby="title description">
  <title id="title">Himlands — a quiet procedural snow world</title>
  <desc id="description">A cinematic snow valley beneath a pale winter sun.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.82" y2="1">
